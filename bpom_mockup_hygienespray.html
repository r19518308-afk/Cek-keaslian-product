<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Pengecekan BPOM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 22px;
      color: #004b87;
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    td.label {
      font-weight: bold;
      width: 35%;
      background: #f0f6fb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hasil Pengecekan Produk BPOM</h1>
    <table>
      <tr>
        <td class="label">Nama Produk</td>
        <td>Hygiene spray</td>
      </tr>
      <tr>
        <td class="label">Merek</td>
        <td>LI CHENG WE</td>
      </tr>
      <tr>
        <td class="label">Nomor Registrasi BPOM</td>
        <td>NA18240115937</td>
      </tr>
      <tr>
        <td class="label">Tanggal Terbit Registrasi</td>
        <td>28 Oktober 2024</td>
      </tr>
      <tr>
        <td class="label">Kemasan</td>
        <td>Botol/Dus 60 ml, Botol/Dus 30 ml, Botol/Dus 15 ml, Botol/Dus 10 ml, Botol/Dus 5 ml</td>
      </tr>
    </table>
  </div>
</body>
</html>
